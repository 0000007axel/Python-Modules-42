[project]
name = "loading"
version = "0.1.0"
description = "A simple introduction to Poetry"
authors = [
    {name = "Seth Axel", email = "seramaro@student.42antananarivo.mg"}
]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.25.0",
    "pandas>=2.1.0",
    "matplotlib>=3.7.2",
    "requests>=2.31.0",
]

[build-system]
requires = ["poetry-core>=2.0.0,<3.0.0"]
build-backend = "poetry.core.masonry.api"
package-mode = false
